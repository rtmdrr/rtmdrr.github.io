name: Update publications from Google Scholar

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scholarly requests
      - name: Fetch publications
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}   # optional, see README
          USE_FREE_PROXY: "0"
        run: python scripts/update_publications.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/publications.json; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update publications from Google Scholar"
            git push
          fi

